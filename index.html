<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B3A">
<meta name="format-detection" content="telephone=no">
<title>CS Knowledge Academy – Life Insurance Training</title>
<meta name="description" content="CS Knowledge Academy – Learn | Grow | Succeed. Session recordings, presentations and learning tools.">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&family=Noto+Serif+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1B3A; --navy-2:#16305F; --gold:#C9A24B; --gold-2:#E3C373; --gold-d:#8A6A1F;
  --bg:#F5F3EE; --surface:#fff; --surface-2:#FBFAF7; --line:#E7E2D6;
  --text:#14213D; --muted:#667085; --ok:#1E8E5A; --ok-bg:#DDF4E8; --warn:#B7791F; --warn-bg:#FBEFD2; --red:#B42318;
  --wa:#178A43; --wa-text:#E6FBD3; --shadow:0 1px 2px rgba(11,27,58,.05),0 8px 24px rgba(11,27,58,.07); --radius:16px; --side:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.serif{font-family:'Playfair Display',Georgia,serif}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;text-decoration:none}
.brand-logo{display:block;height:60px;width:auto;max-width:100%}
.brand b{display:block;font-family:'Playfair Display',serif;font-weight:800;font-size:15px;line-height:1.15}
.brand small{display:block;color:var(--gold-d);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;transition:.15s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--navy);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(11,27,58,.22)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side-bottom{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:var(--wa-text);font-weight:700;padding:11px 14px;border-radius:12px;text-decoration:none}
.wa-btn:hover{filter:brightness(1.05)}
.side-bottom .mini{font-size:12px;color:var(--muted);text-align:center}
.side-bottom .mini a{color:var(--muted)}
.mini.phones{display:grid;gap:2px}.mini.phones a{text-decoration:none;font-weight:600;color:var(--text)}.mini.phones a::before{content:"📞 ";}
main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.adminbar{background:#2b1d00;color:#ffe9b0;padding:9px 36px;font-size:13.5px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.adminbar b{color:#fff}.adminbar a,.adminbar button{color:var(--gold-2);font-weight:600;text-decoration:underline}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 36px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .menu{display:none;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.topbar h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;line-height:1.1}
.topbar p{color:var(--muted);font-size:13.5px}
.topbar .grow{flex:1;min-width:0}
.content{padding:28px 36px 40px;max-width:1180px;width:100%;flex:1}
.footer{padding:20px 36px 30px;color:var(--muted);font-size:13px;display:flex;gap:10px 22px;flex-wrap:wrap;border-top:1px solid var(--line)}
.footer a{color:var(--muted)}
.page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}
.fab{display:none;position:fixed;right:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:50%;background:var(--wa);color:var(--wa-text);place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28);text-decoration:none;transition:.2s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:30px;height:30px;stroke:none;fill:var(--wa-text)}

/* crest + crown */
.crest{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--navy);font-family:'Playfair Display',serif;font-weight:900;font-size:24px;box-shadow:0 0 0 4px rgba(201,162,75,.25),0 10px 30px rgba(0,0,0,.3)}
.crest.sm{width:44px;height:44px;font-size:16px;box-shadow:0 0 0 3px rgba(201,162,75,.22)}
.crest-stack{display:inline-flex;flex-direction:column;align-items:center;flex:none}
.crown{display:block;position:relative;z-index:2;pointer-events:none;margin-bottom:-10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.crown canvas{display:block;width:100%;height:100%}
.crown-fb{width:100%;height:100%;perspective:380px;display:grid;place-items:center}
.crown-fb svg{width:78%;height:auto;animation:crownspin 4s linear infinite}
@keyframes crownspin{to{transform:rotateY(360deg)}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:38px 42px;color:#fff;margin-bottom:26px;background:radial-gradient(700px 320px at 95% -20%,rgba(201,162,75,.35),transparent 60%),linear-gradient(135deg,#0B1B3A,#16305F);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 90%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:flex;gap:30px;align-items:center;justify-content:space-between}
.hero-grid>div:first-child{flex:1;min-width:0}
.hero-logo{display:inline-grid;place-items:center;width:132px;height:132px;padding:12px;margin-bottom:14px;border-radius:30px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.35),0 0 0 4px rgba(201,162,75,.55)}.hero-logo img{width:100%;height:100%;object-fit:contain}
@media(max-width:560px){.hero-logo{width:104px;height:104px;border-radius:24px}}
.hero .hero-crest .crest{width:72px;height:72px;font-size:28px}
.hero .eyebrow{margin-top:12px;font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2)}
.hero h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,4vw,54px);line-height:1.05;text-transform:uppercase;margin-top:8px}
.hero p{margin-top:14px;color:#C9D4EC;max-width:540px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero-founder{flex:none;text-align:center;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero-founder img{width:200px;height:230px;object-fit:cover;object-position:50% 10%;border-radius:110px 110px 22px 22px;border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(201,162,75,.18),0 18px 40px rgba(0,0,0,.4);background:#fff;transition:.25s}
.hero-founder:hover img{transform:translateY(-4px)}
.hero-founder b{font-family:'Playfair Display',serif;font-size:21px;margin-top:14px}
.hero-founder span{color:var(--gold-2);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:12px;font-weight:600;transition:.15s;border:1.5px solid transparent;text-decoration:none;font-size:14.5px;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,27,58,.25)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0B1B3A}.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(201,162,75,.4)}
.btn-wa{background:var(--wa);color:var(--wa-text)}.btn-wa:hover{filter:brightness(1.06)}
.btn-ghost{border-color:var(--line);background:var(--surface);color:var(--text)}.btn-ghost:hover{border-color:var(--gold)}
.btn-ghost.on-dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.btn-danger{border-color:#E7B4B4;color:var(--red);background:transparent}.btn-danger:hover{background:#FDECEC}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.txt{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:0;width:100%}
.txt:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.18)}
textarea.txt{min-height:120px;resize:vertical}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.toolbar .txt{max-width:420px;flex:1;min-width:200px}
.toolbar select.txt{max-width:200px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.empty h3{color:var(--text);margin-bottom:4px}
.err{display:flex;gap:10px;background:#FDECEC;color:var(--red);border:1px solid #F3C2C2;padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:26px}
.tile{display:flex;gap:16px;align-items:center;padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;transition:.2s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0B1B3A;flex:none}
.tile .ic svg{width:24px;height:24px}
.contact{display:flex;gap:10px;flex-wrap:wrap}
.tile b{display:block;font-size:16px}.tile span{color:var(--muted);font-size:13.5px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 14px}
.section-h h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:800}
.link{color:var(--gold-d);font-weight:600;text-decoration:none;cursor:pointer}

/* announcement / upcoming cards */
.announce{display:grid;grid-template-columns:1fr;gap:20px}
.ucard{display:grid;grid-template-columns:260px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.ucard.noposter{grid-template-columns:1fr}
.ucard .poster{background:var(--navy);cursor:zoom-in;position:relative}
.ucard .poster img{width:100%;height:100%;object-fit:cover;display:block}
.ucard .poster span{position:absolute;left:10px;bottom:10px;background:rgba(11,27,58,.85);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.ucard .body{padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.ucard h3{font-family:'Playfair Display',serif;font-size:24px;line-height:1.2}
.ucard .when{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ucard .when .date{font-weight:700;background:var(--navy);color:#fff;padding:5px 14px;border-radius:10px}
.ucard .sched{color:var(--muted)}
.ucard .det{white-space:pre-line;font-size:14.5px}
.ucard .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.ucard.mini{grid-template-columns:120px 1fr}
.ucard.mini.noposter{grid-template-columns:1fr}
.ucard.mini .body{padding:16px 20px}.ucard.mini h3{font-size:19px}

/* session blocks + rows */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.sess summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,#0B1B3A,#16305F);color:#fff}
.sess summary::-webkit-details-marker{display:none}
.sess summary h3{font-family:'Playfair Display',serif;font-size:21px;line-height:1.2}
.sess summary small{color:var(--gold-2);font-weight:600;letter-spacing:.04em}
.sess summary .count{margin-left:auto;background:rgba(255,255,255,.14);padding:3px 12px;border-radius:99px;font-size:13px;font-weight:600}
.sess summary .chev{transition:.2s}.sess[open] summary .chev{transform:rotate(90deg)}
.sess .note{padding:12px 22px 0;color:var(--muted);font-size:14px}
.sess .list{padding:10px 14px 14px}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);padding:14px 8px 6px}
.rec{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:12px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--surface-2)}
.dbadge{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.dbadge b{display:block;font-family:'Playfair Display',serif;font-size:20px}
.dbadge span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-d);font-weight:700}
.rec .mid{flex:1;min-width:0}.rec .mid b{display:block;font-weight:600}
.rec .mid small{color:var(--muted)}
.rec .acts{display:flex;gap:8px;flex-wrap:wrap}
.pcard{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.pcard .mid{flex:1;min-width:0}.pcard .mid b{display:block;font-size:16px}.pcard .mid small{color:var(--muted)}
.pcard .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn);flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:10px}
.app h3{font-family:'Playfair Display',serif;font-size:20px}.app p{color:var(--muted);flex:1}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;margin-bottom:20px}
.lockcard .head{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.lockcard .head h3{font-family:'Playfair Display',serif;font-size:24px}
.lockcard form{display:flex;gap:10px;flex-wrap:wrap;max-width:520px}
.lockcard form .txt{flex:1;min-width:200px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld small{display:block;color:var(--muted);margin-top:4px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* founder */
.founder{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:34px;align-items:start}
.f-photo{position:sticky;top:96px}
.f-frame{border-radius:24px;overflow:hidden;border:3px solid var(--gold);box-shadow:var(--shadow),0 0 0 8px rgba(201,162,75,.15);background:#fff;aspect-ratio:4/4.4}
.f-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.f-plaque{margin-top:16px;text-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;border:1px solid var(--gold)}
.f-plaque b{display:block;font-family:'Playfair Display',serif;font-size:22px}
.f-plaque span{display:block;color:var(--gold-2);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-top:2px}
.f-body h3.name{font-family:'Playfair Display',serif;font-size:clamp(30px,3.6vw,44px);font-weight:900;line-height:1.1;margin:10px 0 4px}
.f-body .role{color:var(--gold-d);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.f-body .lead{font-size:17px;line-height:1.7;margin:20px 0 26px;padding-left:18px;border-left:3px solid var(--gold)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.pillar .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0B1B3A;margin-bottom:12px}
.pillar h4{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:6px}.pillar p{color:var(--muted);font-size:14.5px}

/* admin */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:#6b4a0a;border:1px solid #EBD39A;border-radius:14px;padding:14px 18px;margin-bottom:18px}
.banner b{color:#4a3206}.banner .grow{flex:1;min-width:220px}
.arow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.arow .mid{flex:1;min-width:0}.arow .mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}.arow .mid small{color:var(--muted);display:block;overflow-wrap:anywhere;word-break:break-all}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.help{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px;margin-bottom:16px}
.help b{color:var(--text)}

/* modals */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,10,24,.78);backdrop-filter:blur(6px)}
.modal.open{display:flex;animation:fade .2s}
.m-card{width:100%;max-width:960px;max-height:96vh;overflow:auto;background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.m-card.narrow{max-width:560px}
.m-head{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.m-head small{color:var(--gold-d);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.m-head h3{font-family:'Playfair Display',serif;font-size:20px;line-height:1.25}
.m-head .x{margin-left:auto;padding:8px;border-radius:10px;color:var(--muted)}.m-head .x:hover{background:var(--surface-2);color:var(--text)}
.m-player{background:#000;aspect-ratio:16/9;position:relative}
.m-player.audio{aspect-ratio:auto;height:300px;background:linear-gradient(135deg,#0B1B3A,#16305F)}
.m-player.img{aspect-ratio:auto;background:#0B1B3A;text-align:center}
.m-player.img img{max-width:100%;max-height:78vh;display:block;margin:0 auto}
.m-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.m-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:flex-end;padding:14px 22px}
.m-foot .note{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.m-form{padding:20px 22px}

/* ---------- cheer buttons + playful pop-ups (Subscribe / Like / Comment / Share) ---------- */
.rec{flex-wrap:wrap}

.cb .e{display:inline-block;font-size:17px;line-height:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.cb::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);transition:left .55s}
.cb:hover,.cb:focus-visible{background:var(--c);color:#fff;transform:translateY(-3px) rotate(-2deg) scale(1.07);box-shadow:0 10px 20px -6px var(--c);outline:none}
.cb:hover .e,.cb:focus-visible .e{transform:scale(1.35) rotate(-14deg);animation:wob .7s}
.cb:hover::after{left:140%}
.cb:active{transform:scale(.93)}
.cb.sub{--c:#E11D48}.cb.like{--c:#2563EB}.cb.com{--c:#059669}.cb.share{--c:#7C3AED}
@keyframes wob{0%,100%{rotate:0deg}25%{rotate:-18deg}50%{rotate:14deg}75%{rotate:-8deg}}
.cheer-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:16px 20px;border-radius:20px;color:#fff;background:linear-gradient(120deg,#03308a,#0777d9 55%,#35cdfb);box-shadow:0 12px 28px -12px rgba(25, 167, 193, 0.7)}

.cheer-banner .cb{background:#fff;border-color:#fff}.cheer-banner .cb:hover{background:var(--c);border-color:#fff}
.pop-card{position:relative;overflow:hidden;width:min(440px,100%);padding:34px 26px 22px;text-align:center;background:var(--surface);border-radius:30px;border-top:9px solid var(--c);box-shadow:0 30px 70px rgba(0,0,0,.45);animation:popin .45s cubic-bezier(.34,1.56,.64,1)}

.pop-e{display:block;font-size:76px;line-height:1;margin-bottom:6px;animation:bob 1.6s ease-in-out infinite}

.pbtn{--c:#E11D48;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;border-radius:16px;border:0;background:var(--c);color:#fff;font:800 16px/1.1 'Inter',sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 10px 22px -8px var(--c);transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s,box-shadow .2s}
.pbtn:hover{transform:translateY(-4px) scale(1.04) rotate(-1deg);filter:brightness(1.08);box-shadow:0 16px 28px -8px var(--c)}.pbtn:active{transform:scale(.96)}
.pbtn.alt{background:var(--surface);color:var(--c);border:2px solid var(--c);box-shadow:none}.pbtn.alt:hover{background:var(--c);color:#fff}
.pbtn.wa{--c:#16A34A}.pbtn.cp{--c:#7C3AED}.pbtn.more{--c:#0B1B3A}
.pop-more{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(520px) rotate(700deg)}}
@media (max-width:560px){

/* SHA-256 (pure JS; works when opened as a file too) */
function sha256(str){
  const b=new TextEncoder().encode(str),l=b.length,K=[],H=[];
  for(let c=2,n=0;n<64;c++){let p=true;for(let d=2;d*d<=c;d++)if(c%d===0){p=false;break}
    if(p){if(n<8)H[n]=((Math.pow(c,1/2)%1)*4294967296)|0;K[n]=((Math.pow(c,1/3)%1)*4294967296)|0;n++}}
  const nb=((l+9+63)>>6)<<6,w=new Uint8Array(nb);w.set(b);w[l]=0x80;
  const dv=new DataView(w.buffer);dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  const ror=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){const W=new Array(64);for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=ror(W[i-15],7)^ror(W[i-15],18)^(W[i-15]>>>3),s1=ror(W[i-2],17)^ror(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=ror(e,6)^ror(e,11)^ror(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])|0,S0=ror(a,2)^ror(a,13)^ror(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}

/* AES-GCM encryption for the ongoing session (key derived from its password) */
const b64=buf=>{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptJSON(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await deriveKey(pw,salt),new TextEncoder().encode(JSON.stringify(obj)));
  return {salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decryptJSON(enc,pw){
  try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(enc.iv)},await deriveKey(pw,unb64(enc.salt)),unb64(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}
  catch(e){return null}
}
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);

function findRec(id){
  for(const s of DATA.sessions){const r=(recsOf(s)||[]).find(x=>x.id===id);if(r)return r}

}
function pptLinks(p){
  const u=p.link||"";let view=u,dl=p.download||"",m;
  if((m=u.match(/docs\.google\.com\/presentation\/d\/([\w-]+)/))){view=`https://docs.google.com/presentation/d/${m[1]}/preview`;dl=dl||`https://docs.google.com/presentation/d/${m[1]}/export/pdf`}
  else if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))){view=`https://drive.google.com/file/d/${m[1]}/preview`;dl=dl||`https://drive.google.com/uc?export=download&id=${m[1]}`}
  else if(/\.pptx?($|\?)/i.test(u)){view=`https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(u)}`;dl=dl||u}
  else dl=dl||u;
  return {view,dl,open:u};
}

/* draft (admin changes saved in this browser until published) */
async function serialize(){
  const out=clone(DATA);
  for(const s of out.sessions){
    if(s.status==="ongoing"){const u=UNLOCK[s.id];if(u)s.enc=await encryptJSON(u.rec,u.pw);delete s.recordings}
    else delete s.enc;
  }
  out.updated=Date.now();return out;
}
async function commit(){
  const out=await serialize();
  const ok=store.set("csk_draft",{savedAt:Date.now(),data:out});
  if(!ok)toast("Could not save in this browser – download data.js now");
  DIRTY=true;renderAdminBar();rerender();
}
async function downloadData(){
  const out=await serialize();
  const txt="/* CS KNOWLEDGE ACADEMY – site content. Edit through the Admin page, then replace this file. */\nwindow.CSK_DATA = "+JSON.stringify(out,null,1)+";\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));a.download="data.js";document.body.appendChild(a);a.click();a.remove();
  toast("data.js downloaded – upload it to your website");
}

function resizeImage(file,max=1000){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(file)});
}
function fieldHTML(f,v){
  const id="f_"+f.k,val=v??f.def??"",hint=f.hint?`<small>${f.hint}</small>`:"";
  let ctl="";
  if(f.type==="textarea")ctl=`<textarea class="txt" id="${id}" rows="${f.rows||5}">${esc(val)}</textarea>`;
  else if(f.type==="select")ctl=`<select class="txt" id="${id}">${f.opts.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  else if(f.type==="checkbox")return `<div class="fld"><label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--text)"><input type="checkbox" id="${id}" ${val?"checked":""}> ${f.label}</label>${hint}</div>`;
  else if(f.type==="image"){FM.imgs[f.k]=val||"";ctl=`<input class="txt" type="file" id="${id}" accept="image/*"><div id="prev_${f.k}" style="margin-top:8px">${val?`<img src="${esc(val)}" style="max-width:140px;border-radius:10px;border:1px solid var(--line)"> <button type="button" class="btn btn-ghost btn-sm" data-rmimg="${f.k}">Remove</button>`:""}</div>`}
  else ctl=`<input class="txt" id="${id}" type="${f.type||"text"}" value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} autocomplete="off">`;
  return `<div class="fld"><label for="${id}">${f.label}${f.req?" *":""}</label>${ctl}${hint}</div>`;
}

  return `<article class="ucard ${hasP?"":"noposter"} ${mini?"mini":""}">
    ${hasP?`<div class="poster" data-poster="${esc(u.id)}" role="button" tabindex="0" aria-label="View poster"><img src="${esc(u.poster)}" alt="Poster: ${esc(u.title)}" loading="lazy">${mini?"":'<span>Click to enlarge</span>'}</div>`:""}
    <div class="body">
      <div class="when">${u.startDate?`<span class="date">Starts ${fmtDate(u.startDate)}</span>`:""}<span class="tag">Upcoming</span></div>
      <h3>${esc(u.title)}</h3>
      ${u.schedule?`<div class="sched">${esc(u.schedule)}</div>`:""}
      ${mini?"":(u.details?`<div class="det">${esc(u.details)}</div>`:"")}
      <div class="acts">${u.register&&waDigits()?`<a class="btn btn-wa" href="${waLink("Hello, I would like to register for: "+u.title)}" target="_blank" rel="noopener noreferrer">${WA_SVG} Register on WhatsApp</a>`:""}${hasP?`<button class="btn btn-ghost" data-poster="${esc(u.id)}">View poster</button>`:""}${mini?`<a class="btn btn-ghost" href="#/upcoming">Details</a>`:""}</div>
    </div></article>`;
}

function recRow(r,kinds){
  const p=parts(r.date);
  return `<div class="rec"><div class="dbadge"><b>${p?String(p.d).padStart(2,"0"):"–"}</b><span>${p?MON[p.m-1]:""}</span></div>
    <div class="mid"><b>${esc(r.title)}</b><small>${fmtDate(r.date)}${r.group?" · "+esc(r.group):""} · <span class="lchip ${langOf(r)}">${langOf(r)==="english"?"English":"தமிழ் Tamil"}</span></small></div>
    <div class="acts">${kinds.map(k=>!r[k]?"":k==="video"?`<a class="btn btn-primary btn-sm" href="${esc(safeUrl(r.video))}" target="_blank" rel="noopener noreferrer">${icon("play","style='width:16px;height:16px'")} Watch on YouTube</a>`:`<button class="btn btn-ghost btn-sm" data-play="${esc(r.id)}" data-kind="audio">${icon("audio","style='width:16px;height:16px'")} Listen</button>`).join("")}</div>${kinds.includes("video")&&r.video?cheerBtns(r.id):""}</div>`;
}
function recList(rows,kinds){
  let html="",last=null;
  rows.forEach(r=>{if(r.group&&r.group!==last){html+=`<div class="grp">${esc(r.group)}</div>`;last=r.group}else if(!r.group)last=null;html+=recRow(r,kinds)});
  return html;
}
const recMatch=(q,r,s)=>!q||norm(`${r.title} ${r.group||""} ${fmtDate(r.date)} ${s.title}`).includes(q);
const LANGS=[["tamil","தமிழ்","Tamil"],["english","English","English"]];
const langOf=r=>r.lang==="english"?"english":"tamil";
let CUR_LANG="tamil";
function mediaView(kind){
  return el=>{
    el.innerHTML=`${kind==="video"?cheerBanner():""}<div class="langtabs" role="tablist" aria-label="Language"></div><div class="toolbar"><input class="txt" id="q" type="search" placeholder="Search by topic or date…" aria-label="Search"></div><div id="out"></div>`;
    const draw=()=>{
      const q=norm($("#q",el).value.trim());let html="";
      const cnt={tamil:0,english:0};completedSessions().forEach(s=>(s.recordings||[]).forEach(r=>{if(r[kind])cnt[langOf(r)]++}));
      $(".langtabs",el).innerHTML=LANGS.map(([k,nat,en])=>`<button type="button" role="tab" aria-selected="${CUR_LANG===k}" class="ltab${CUR_LANG===k?" on":""}" data-lang="${k}"><b>${nat}</b>${nat!==en?`<small>${en}</small>`:""}<span class="n">${cnt[k]}</span></button>`).join("");
      completedSessions().forEach(s=>{
        const rows=(s.recordings||[]).filter(r=>r[kind]&&langOf(r)===CUR_LANG&&recMatch(q,r,s));if(!rows.length)return;
        html+=`<details class="sess" open><summary><span class="chev">${icon("chev")}</span><div><h3>${esc(s.title)}</h3><small>${fmtRange(s.from,s.to)}</small></div><span class="count">${rows.length}</span></summary>${s.note&&!q?`<div class="note">${esc(s.note)}</div>`:""}<div class="list">${recList(rows,[kind])}</div></details>`;
      });
      $("#out",el).innerHTML=html||`<div class="empty"><h3 class="serif">${q?"Nothing found":"No "+(CUR_LANG==="english"?"English":"Tamil")+" recordings yet"}</h3><p>${q?"Try a different word.":"New classes will appear here as soon as they are published."}</p></div>`;
    };
    $("#q",el).oninput=draw;el.addEventListener("click",e=>{const t=e.target.closest("[data-lang]");if(t){CUR_LANG=t.dataset.lang;draw()}});draw();
  };
}
VIEWS.videos=mediaView("video");VIEWS.audios=mediaView("audio");

VIEWS.ongoing=el=>{
  const list=ongoingSessions();
  if(!list.length){el.innerHTML=`<div class="empty"><h3 class="serif">No session is running right now</h3><p>When a session starts, its recordings will be available here with a password.</p><p style="margin-top:12px"><a class="btn btn-gold" href="#/upcoming">See upcoming sessions</a></p></div>`;return}
  el.innerHTML=list.map(s=>{
    const recs=UNLOCK[s.id]?UNLOCK[s.id].rec:null;
    return `<section class="lockcard" data-sid="${esc(s.id)}"><div class="head"><span class="tag">Ongoing</span><h3>${esc(s.title)}</h3><small style="color:var(--muted)">${fmtRange(s.from,s.to)}</small></div>
      ${s.note?`<p style="color:var(--muted);margin-bottom:14px">${esc(s.note)}</p>`:""}
      ${recs?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="tag ok">Unlocked</span><button class="btn btn-ghost btn-sm" data-relock="${esc(s.id)}">${icon("lock","style='width:15px;height:15px'")} Lock</button></div>
          ${recs.length?`<div class="list">${recList(recs,["video","audio"])}</div>`:'<p style="color:var(--muted)">No recordings uploaded yet – please check back soon.</p>'}`
        :(s.enc?`<div class="err" id="err_${esc(s.id)}" hidden></div><form data-unlock="${esc(s.id)}"><input class="txt" type="password" placeholder="Enter the session password" aria-label="Session password" required><button class="btn btn-gold" type="submit">${icon("lock")} Unlock</button></form><p style="color:var(--muted);font-size:13px;margin-top:10px">The password is shared with registered participants.</p>`
          :'<p style="color:var(--muted)">Recordings will be added soon.</p>')}</section>`;
  }).join("");
  $$("[data-unlock]",el).forEach(f=>f.onsubmit=async e=>{
    e.preventDefault();const s=DATA.sessions.find(x=>x.id===f.dataset.unlock),er=$("#err_"+s.id,el);
    if(!hasCrypto()){er.hidden=false;er.textContent="This page must be opened over https (or localhost) for the password lock to work.";return}
    const btn=$("button",f);btn.disabled=true;
    const pw=$("input",f).value,rec=await decryptJSON(s.enc,pw);btn.disabled=false;
    if(!rec){er.hidden=false;er.textContent="Incorrect password. Please try again.";$("input",f).value="";$("input",f).focus();return}
    UNLOCK[s.id]={rec,pw};rerender();toast("Session unlocked");
  });
  $$("[data-relock]",el).forEach(b=>b.onclick=()=>{if(ADMIN){toast("In admin mode the session stays unlocked for editing");return}delete UNLOCK[b.dataset.relock];rerender()});
};

    ${rows.map(s=>{const n=(recsOf(s)||[]).length;return listRow(`${esc(s.title)} ${s.status==="ongoing"?'<span class="tag">Ongoing</span>':'<span class="tag ok">Completed</span>'}`,`${fmtRange(s.from,s.to)} · ${s.status==="ongoing"&&!UNLOCK[s.id]?"recordings locked":n+" recordings"}`,aBtn("open",s.id,"Open / add recordings","btn-primary")+aBtn("edit",s.id,"Edit")+aBtn("del",s.id,"Delete","btn-danger"))}).join("")||'<div class="empty">No sessions yet.</div>'}`;
  bind(body,{
    add:()=>showForm({title:"Add session",fields:sessFields(true),values:{status:"completed"},onSubmit:async v=>{
      if(v.status==="ongoing"){if(!v.password||v.password.length<4)return "Please set a password of at least 4 characters for an ongoing session.";if(!hasCrypto())return "The password lock needs https or localhost. Open the site through Live Server."}
      const s={id:uid("s"),title:v.title,from:v.from,to:v.to,note:v.note,status:v.status};
      if(v.status==="ongoing")UNLOCK[s.id]={rec:[],pw:v.password};else s.recordings=[];
      DATA.sessions.push(s);AS.sess=s.id;await commit()}}),
    open:id=>{AS.sess=id;rerender()},
    edit:id=>{const s=DATA.sessions.find(x=>x.id===id);showForm({title:"Edit session details",fields:sessFields(false),values:s,onSubmit:async v=>{Object.assign(s,v);await commit()}})},
    del:async id=>{if(confirm("Delete this whole session and all its recordings?")){DATA.sessions=DATA.sessions.filter(x=>x.id!==id);delete UNLOCK[id];await commit()}}});
}
const recFields=[{k:"date",label:"Date",type:"date",req:1},{k:"title",label:"Title",req:1},{k:"lang",label:"Language of the class",type:"select",opts:[{v:"tamil",l:"Tamil"},{v:"english",l:"English"}]},{k:"group",label:"Sub-heading (optional)",ph:"e.g. Riders"},
  {k:"video",label:"Video link (YouTube)",type:"url"},{k:"audio",label:"Audio link (Google Drive)",type:"url",hint:"Add a video link, an audio link, or both."}];
function adminSessionEditor(body){
  const s=DATA.sessions.find(x=>x.id===AS.sess);if(!s){AS.sess=null;return adminSessions(body)}
  const recs=recsOf(s);
  const head=`<div style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" data-a="back">← All sessions</button></div>
    <div class="panel" style="margin-bottom:18px"><h3 class="serif" style="font-size:22px">${esc(s.title)} ${s.status==="ongoing"?'<span class="tag">Ongoing</span>':'<span class="tag ok">Completed</span>'}</h3><p style="color:var(--muted)">${fmtRange(s.from,s.to)}</p></div>`;
  if(!recs){ // ongoing and locked
    body.innerHTML=head+`<div class="panel"><p style="margin-bottom:12px">This session is <b>locked</b>. Enter its password to view and edit its recordings.</p><div id="ue"></div>
      <form id="uf" style="display:flex;gap:10px;flex-wrap:wrap;max-width:480px"><input class="txt" type="password" id="upw" placeholder="Session password" style="flex:1;min-width:200px"><button class="btn btn-gold" type="submit">Unlock</button></form>
      <p style="margin-top:14px"><button class="btn btn-danger btn-sm" data-a="forgot">Forgot the password? Set a new one</button></p></div>`;
    $("#uf",body).onsubmit=async e=>{e.preventDefault();const pw=$("#upw",body).value,r=s.enc?await decryptJSON(s.enc,pw):null;if(!r){$("#ue",body).innerHTML='<div class="err">Incorrect password.</div>';return}UNLOCK[s.id]={rec:r,pw};rerender()};
    bind(body,{back:()=>{AS.sess=null;rerender()},forgot:()=>showForm({title:"Set a new password",intro:"The recordings of this session are encrypted with the old password and cannot be recovered. You will need to add them again.",fields:[{k:"pw",label:"New password",type:"password",req:1}],onSubmit:async v=>{if(v.pw.length<4)return "Use at least 4 characters.";UNLOCK[s.id]={rec:[],pw:v.pw};await commit()}})});
    return;
  }
  const ongoing=s.status==="ongoing";
  body.innerHTML=head+`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><button class="btn btn-gold" data-a="addrec">+ Add recording</button>
      ${ongoing?`<button class="btn btn-primary" data-a="complete">✓ Mark as completed (open to all)</button><button class="btn btn-ghost" data-a="chpw">Change password</button>`:`<button class="btn btn-ghost" data-a="makeongoing">Make this an ongoing (locked) session</button>`}</div>
    ${recs.map((r,i)=>listRow(`${esc(r.title)}`,`${fmtDate(r.date)}${r.group?" · "+esc(r.group):""} · ${[r.video?"Video":"",r.audio?"Audio":""].filter(Boolean).join(" + ")||"no links"}`,
      `<button class="btn btn-ghost btn-sm" data-a="up" data-id="${i}" ${i===0?"disabled":""} aria-label="Move up">${icon("up","style='width:14px;height:14px'")}</button><button class="btn btn-ghost btn-sm" data-a="down" data-id="${i}" ${i===recs.length-1?"disabled":""} aria-label="Move down">${icon("down","style='width:14px;height:14px'")}</button>`+aBtn("editrec",r.id,"Edit")+aBtn("delrec",r.id,"Delete","btn-danger"))).join("")||'<div class="empty">No recordings yet. Press “Add recording”.</div>'}`;
  const move=async(i,d)=>{i=+i;const j=i+d;if(j<0||j>=recs.length)return;[recs[i],recs[j]]=[recs[j],recs[i]];await commit()};
  bind(body,{
    back:()=>{AS.sess=null;rerender()},
    addrec:()=>showForm({title:"Add recording",fields:recFields,values:{date:new Date().toISOString().slice(0,10),lang:"tamil"},onSubmit:async v=>{if(!v.video&&!v.audio)return "Add a video link or an audio link.";recs.push({id:uid("r"),...v});await commit()}}),
    editrec:id=>{const r=recs.find(x=>x.id===id);showForm({title:"Edit recording",fields:recFields,values:r,onSubmit:async v=>{if(!v.video&&!v.audio)return "Add a video link or an audio link.";Object.assign(r,v);await commit()}})},
    delrec:async id=>{if(confirm("Delete this recording?")){const i=recs.findIndex(x=>x.id===id);recs.splice(i,1);await commit()}},
    up:i=>move(i,-1),down:i=>move(i,1),
    complete:async()=>{if(!confirm("Mark this session as completed? Its recordings become open to everyone under Video and Audio Recordings."))return;s.recordings=UNLOCK[s.id].rec;delete s.enc;delete UNLOCK[s.id];s.status="completed";await commit()},
    chpw:()=>showForm({title:"Change session password",fields:[{k:"pw",label:"New password",type:"password",req:1}],onSubmit:async v=>{if(v.pw.length<4)return "Use at least 4 characters.";UNLOCK[s.id].pw=v.pw;await commit();toast("Password changed")}}),
    makeongoing:()=>showForm({title:"Make session ongoing",intro:"The recordings will be hidden from the open Video/Audio pages and need this password.",fields:[{k:"pw",label:"Session password",type:"password",req:1}],onSubmit:async v=>{if(v.pw.length<4)return "Use at least 4 characters.";if(!hasCrypto())return "The password lock needs https or localhost.";UNLOCK[s.id]={rec:s.recordings||[],pw:v.pw};delete s.recordings;s.status="ongoing";await commit()}})
  });
}

/* ----------------------------- rotating 3D crown ----------------------------- */
const CROWNS=[];let crownLoop=false;const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const CROWN_SVG='<div class="crown-fb"><svg viewBox="0 0 64 48"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D88F"/><stop offset="1" stop-color="#C9A24B"/></linearGradient></defs><path d="M5 38 L9 12 L22 26 L32 6 L42 26 L55 12 L59 38 Z" fill="url(#cg)" stroke="#8A6A1F" stroke-width="1.2" stroke-linejoin="round"/><rect x="5" y="38" width="54" height="7" rx="2" fill="url(#cg)" stroke="#8A6A1F" stroke-width="1.2"/><circle cx="32" cy="41.5" r="2.2" fill="#C0182A"/></svg></div>';
function makeCrown(box){
  const w=+box.dataset.w||100,h=+box.dataset.h||74;box.style.width=w+"px";box.style.height=h+"px";
  if(typeof THREE==="undefined"){box.innerHTML=CROWN_SVG;return}
  try{
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(w,h);renderer.setClearColor(0,0);box.appendChild(renderer.domElement);
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,w/h,.1,50);cam.position.set(0,1,5.3);cam.lookAt(0,.5,0);
    scene.add(new THREE.AmbientLight(0xffffff,.6));const k=new THREE.DirectionalLight(0xfff1cf,1);k.position.set(3,5,5);scene.add(k);const r=new THREE.DirectionalLight(0xffd88a,.7);r.position.set(-4,2,-3);scene.add(r);
    const gold=new THREE.MeshPhongMaterial({color:0xD9AE45,specular:0xfff2c0,shininess:100,emissive:0x2a1c00,side:THREE.DoubleSide}),ruby=new THREE.MeshPhongMaterial({color:0xC0182A,specular:0xffffff,shininess:140,emissive:0x2a0004});
    const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(1,.88,.55,48,1,true),gold));
    [[.88,-.275],[1,.275]].forEach(([rr,y])=>{const t=new THREE.Mesh(new THREE.TorusGeometry(rr,.06,12,64),gold);t.rotation.x=Math.PI/2;t.position.y=y;g.add(t)});
    const N=6;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,tall=i%2===0,H=tall?1.05:.72,rad=.95;
      const cone=new THREE.Mesh(new THREE.ConeGeometry(.24,H,24),gold);cone.position.set(Math.cos(a)*rad,.275+H/2,Math.sin(a)*rad);g.add(cone);
      const ball=new THREE.Mesh(new THREE.SphereGeometry(tall?.13:.1,18,18),gold);ball.position.set(Math.cos(a)*rad,.275+H+.04,Math.sin(a)*rad);g.add(ball);
      const gem=new THREE.Mesh(new THREE.SphereGeometry(.1,18,18),ruby);gem.scale.set(1,1,.55);const aa=a+Math.PI/N;gem.position.set(Math.cos(aa)*.97,0,Math.sin(aa)*.97);gem.lookAt(Math.cos(aa)*3,0,Math.sin(aa)*3);g.add(gem)}
    g.rotation.x=.22;g.position.y=-.1;scene.add(g);CROWNS.push({box,renderer,scene,cam,g});renderer.render(scene,cam);
    if(!crownLoop){crownLoop=true;const t0=performance.now();(function tick(now){requestAnimationFrame(tick);
      for(let i=CROWNS.length-1;i>=0;i--){const c=CROWNS[i];if(!c.box.isConnected){c.renderer.dispose();CROWNS.splice(i,1);continue}
        if(c.box.offsetParent===null)continue;c.g.rotation.y=REDUCED?.6:((now-t0)/1000)*1.1;c.renderer.render(c.scene,c.cam)}})(t0)}
  }catch(err){box.innerHTML=CROWN_SVG}
}
function initCrowns(root){$$(".crown:not([data-ready])",root||document).forEach(b=>{b.dataset.ready="1";makeCrown(b)})}

/* ----------------------------- eye icon on every password box ----------------------------- */
(function(){
  const EYE='<svg class="i" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const OFF='<svg class="i" viewBox="0 0 24 24"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  function wrap(inp){
    if(inp.dataset.eye)return;inp.dataset.eye="1";
    const had=document.activeElement===inp;
    const w=document.createElement("span");w.className="pw-wrap";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement("button");b.type="button";b.className="pw-eye";b.innerHTML=EYE;
    b.setAttribute("aria-label","Show password");b.title="Show password";
    b.onclick=()=>{const show=inp.type==="password";inp.type=show?"text":"password";b.innerHTML=show?OFF:EYE;
      const t=show?"Hide password":"Show password";b.title=t;b.setAttribute("aria-label",t);inp.focus()};
    w.appendChild(b);if(had)inp.focus();
  }
  const scan=r=>r.querySelectorAll&&r.querySelectorAll('input[type="password"]').forEach(wrap);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches('input[type="password"]'))wrap(n);else scan(n)}))).observe(document.body,{childList:true,subtree:true});
  scan(document);
})();
